version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
      - WORKERS=4
      - CORS_ORIGINS=["http://localhost","http://localhost:80","https://abysseye.ocean.org"]
    volumes:
      - ./data/contacts:/app/data/contacts
      - ./models:/app/models
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/sonar/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
      - NEXT_PUBLIC_WS_URL=/api/v1/ws/survey-stream
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  nginx:
    image: nginx:alpine
    container_name: abysseye-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
